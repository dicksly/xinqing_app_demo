name: Deploy to ECS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install backend dependencies
        run: |
          cd /opt/xinqing_app_demo/backend
          python3.11 -m pip install -r requirements.txt -i https://mirrors.aliyun.com/pypi/simple/ --trusted-host mirrors.aliyun.com
          
      - name: Build frontend
        run: |
          cd /opt/xinqing_app_demo/frontend
          npm ci --registry=https://registry.npmmirror.com
          npm run build
          
      - name: Deploy frontend
        run: |
          rm -rf /opt/xinqing_app_demo/frontend/dist
          cp -r /home/github-runner/actions-runner/_work/xinqing_app_demo/xinqing_app_demo/frontend/dist /opt/xinqing_app_demo/frontend/
          
      - name: Restart backend
        run: |
          sudo systemctl restart xinqing-backend
          
      - name: Health check
        run: |
          sleep 3
          curl -f http://localhost:8000/health || curl -f http://localhost:8000/ || echo "Backend may need health endpoint"
          curl -f http://localhost/ || echo "Frontend check"
          
      - name: Deployment complete
        run: echo "Deployment completed successfully!"
