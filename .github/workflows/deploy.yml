name: Deploy to ECS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Pull latest code
        run: |
          cd /opt/xinqing_app_demo
          git fetch origin
          git reset --hard origin/main
          
      - name: Install backend dependencies
        run: |
          cd /opt/xinqing_app_demo/backend
          sudo /usr/bin/python3.11 -m pip install -r requirements.txt -i https://mirrors.aliyun.com/pypi/simple/ --trusted-host mirrors.aliyun.com
          
      - name: Build frontend
        run: |
          cd /opt/xinqing_app_demo/frontend
          sudo rm -rf node_modules
          sudo npm install --registy=https://registry.npmmirror.com
          sudo npm run build
          
      - namee: Restart backend
        run: |
          sudo systemctl restart xinqing-backend
          
      - name: Health check
        run: |
          sleep 3
          curl -f http://localhost:8000/ || echo "Backend check"
          curl -f http://localhost/ || echo "Frontend check"
          
      - name: Deployment complete
        run: echo "Deployment completed successfully!"