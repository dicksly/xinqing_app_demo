<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>macOS Web UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            user-select: none;
        }
        
        .menu-bar {
            height: 28px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 13px;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }
        
        .apple-logo {
            font-size: 16px;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        
        .apple-logo:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .menu-item {
            cursor: pointer;
            padding: 2px 10px;
            border-radius: 4px;
            transition: background 0.2s;
            font-weight: 500;
        }
        
        .menu-item:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .menu-right {
            margin-left: auto;
            display: flex;
            gap: 16px;
            align-items: center;
        }
        
        .dock {
            position: fixed;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 6px 10px;
            display: flex;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .dock-item {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        
        .dock-item:hover {
            transform: translateY(-10px) scale(1.2);
        }
        
        .dock-item::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .dock-item.active::after {
            opacity: 1;
        }
        
        .dock-icon {
            font-size: 28px;
        }
        
        .window {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            min-width: 400px;
            min-height: 300px;
        }
        
        .window-header {
            height: 36px;
            background: rgba(245, 245, 247, 0.9);
            display: flex;
            align-items: center;
            padding: 0 12px;
            cursor: move;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }
        
        .window-controls {
            display: flex;
            gap: 8px;
        }
        
        .window-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .window-btn:hover {
            transform: scale(1.1);
        }
        
        .btn-close {
            background: #ff5f57;
        }
        
        .btn-minimize {
            background: #febc2e;
        }
        
        .btn-maximize {
            background: #28c840;
        }
        
        .window-title {
            flex: 1;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: #333;
        }
        
        .window-content {
            padding: 20px;
            height: calc(100% - 36px);
            overflow: auto;
        }
        
        .desktop-icons {
            position: absolute;
            top: 40px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .desktop-icon {
            width: 80px;
            text-align: center;
            cursor: pointer;
            padding: 10px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        
        .desktop-icon:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .desktop-icon-img {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            margin: 0 auto 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .desktop-icon-name {
            color: #fff;
            font-size: 12px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        }
        
        .notification {
            position: fixed;
            top: 40px;
            right: 20px;
            width: 320px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.3s ease-out;
            z-index: 1000;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Menu Bar -->
    <div class="menu-bar">
        <div class="apple-logo"></div>
        <div class="menu-item">Finder</div>

    <!-- Desktop Icons -->

        </div>
    </div>
    
    <!-- Windows Container -->
    <div id="windows-container"></div>
    
    <!-- Dock -->
    <div class="dock">
        <div class="dock-item active" onclick="openWindow('finder')" title="访达">
            <span class="dock-icon">📁</span>
        </div>
        <div class="dock-item" onclick="openWindow('safari')" title="Safari">
            <span class="dock-icon">🧭</span>
        </div>
        <div class="dock-item" onclick="openWindow('notes')" title="备忘录">
            <span class="dock-icon">📝</span>
        </div>
        <div class="dock-item" onclick="openWindow('photos')" title="照片">
            <span class="dock-icon">🖼️</span>
        </div>
        <div class="dock-item" onclick="openWindow('music')" title="音乐">
            <span class="dock-icon">🎵</span>
        </div>
        <div class="dock-item" onclick="openWindow('settings')" title="系统设置">
            <span class="dock-icon">⚙️</span>
        </div>
    </div>
    
    <script>
        // Update time
        function updateTime() {
            const now = new Date();
            const options = { 
                weekday: 'short', 
                month: 'short', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };
            document.getElementById('current-time').textContent = now.toLocaleString('zh-CN', options);
        }
        updateTime();
        setInterval(updateTime, 1000);
        
        // Window management
        let windows = [];
        let zIndex = 100;
        
        function openWindow(type) {
            const existingWindow = windows.find(w => w.type === type);
            if (existingWindow) {
                bringToFront(existingWindow);
                return;
            }
            
            const windowConfig = getWindowConfig(type);
            const windowId = `window-${Date.now()}`;
            
            const windowEl = document.createElement('div');
            windowEl.className = 'window';
            windowEl.id = windowId;
            windowEl.style.left = windowConfig.left;
            windowEl.style.top = windowConfig.top;
            windowEl.style.width = windowConfig.width;
            windowEl.style.height = windowConfig.height;
            windowEl.style.zIndex = ++zIndex;
            
            windowEl.innerHTML = `
                <div class="window-header" onmousedown="startDrag(event, '${windowId}')">
                    <div class="window-controls">
                        <div class="window-btn btn-close" onclick="closeWindow('${windowId}')"></div>
                        <div class="window-btn btn-minimize"></div>
                        <div class="window-btn btn-maximize"></div>
                    </div>
                    <div class="window-title">${windowConfig.title}</div>
                    <div style="width: 52px;"></div>
                </div>
                <div class="window-content">
                    ${windowConfig.content}
                </div>
            `;
            
            windowEl.addEventListener('mousedown', () => bringToFront({ id: windowId }));
            document.getElementById('windows-container').appendChild(windowEl);
            
            windows.push({ id: windowId, type, el: windowEl });
            
            // Mark dock item as active
            updateDockActive(type);
        }

            return configs[type] || configs.finder;

        function closeWindow(windowId) {
            const windowIndex = windows.findIndex(w => w.id === windowId);
            if (windowIndex !== -1) {
                const windowData = windows[windowIndex];
                windowData.el.remove();
                windows.splice(windowIndex, 1);
                updateDockActive();
            }
        }
        
        function bringToFront(windowData) {
            const win = windowData.el || document.getElementById(windowData.id);
            if (win) {
                win.style.zIndex = ++zIndex;
            }
        }
        
        function updateDockActive(type) {
            document.querySelectorAll('.dock-item').forEach(item => {
                item.classList.remove('active');
            });
            if (type) {
                const dockItems = document.querySelectorAll('.dock-item');
                const typeMap = { finder: 0, safari: 1, notes: 2, photos: 3, music: 4, settings: 5 };
                if (dockItems[typeMap[type]]) {
                    dockItems[typeMap[type]].classList.add('active');
                }
            } else {
                windows.forEach(w => {
                    const typeMap = { finder: 0, safari: 1, notes: 2, photos: 3, music: 4, settings: 5 };
                    const dockItems = document.querySelectorAll('.dock-item');
                    if (dockItems[typeMap[w.type]]) {
                        dockItems[typeMap[w.type]].classList.add('active');
                    }
                });
            }
        }
        
        // Window dragging
        let isDragging = false;
        let currentWindow = null;
        let offsetX, offsetY;
        
        function startDrag(e, windowId) {
            isDragging = true;
            currentWindow = document.getElementById(windowId);
            const rect = currentWindow.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
            bringToFront({ id: windowId });
        }
        
        document.addEventListener('mousemove', (e) => {
            if (isDragging && currentWindow) {
                const x = e.clientX - offsetX;
                const y = e.clientY - offsetY;
                currentWindow.style.left = x + 'px';
                currentWindow.style.top = y + 'px';
            }
        });
        
        document.addEventListener('mouseup', () => {
            isDragging = false;
            currentWindow = null;
        });
        
        // Show welcome notification
        setTimeout(() => {
            showNotification('🎉 欢迎', '欢迎使用 macOS 网页界面！');
        }, 1000);
        
        function showNotification(title, message) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.innerHTML = `
                <div style="font-weight: 600; margin-bottom: 4px;">${title}</div>
                <div style="font-size: 13px; color: #666;">${message}</div>
            `;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'fadeOut 0.3s ease-out forwards';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
